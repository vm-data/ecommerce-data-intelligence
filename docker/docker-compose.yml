services:
  postgres:
    image: postgres:17-alpine

    env_file:
      - ../.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?SILO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?SILO_ROOT_PASSWORD is required}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - silo_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  silo_data:
