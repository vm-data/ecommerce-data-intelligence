[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-intelligence"
version = "0.1.0"
description = "Data ingestion and analytics platform for the Olist e-commerce dataset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1,<4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*"]
