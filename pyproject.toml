[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-intelligence"
version = "0.1.0"
description = "Data ingestion and analytics platform for the Olist e-commerce dataset"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
transform = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingestion*", "storage*"]
