version: 2

models:
  - name: stg_customers
    description: "Staging view for Olist customers."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Staging view for Olist orders."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_products
    description: "Staging view for Olist products."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_sellers
    description: "Staging view for Olist sellers."
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_order_items
    description: "Staging view for Olist order items."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

  - name: stg_order_payments
    description: "Staging view for Olist order payments."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential

  - name: stg_product_category_name_translation
    description: "Portuguese-to-English product category lookup."
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null