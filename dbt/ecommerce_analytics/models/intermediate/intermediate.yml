version: 2

models:
  - name: int_order_items_enriched
    description: >
      Enriched order item data combining order, product,
      seller, and product category information.
      The grain is one row per order item.

    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - not_null

      - name: order_item_id
        description: Sequential item number within an order.
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

  - name: int_orders_enriched
    description: >
      Order-level dataset combining order details with
      aggregated item, payment, and review metrics.
      The grain is one row per order.
    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer associated with the order.
        data_tests:
          - not_null
      - name: item_count
        description: Number of items in the order.
      - name: payment_record_count
        description: Number of payment records associated with the order.
      - name: review_count
        description: Number of review records associated with the order.

  - name: int_customers_enriched
    description: >
      Customer-level analytical dataset combining purchase,
      payment, item, review and latest observed location
      metrics. The grain is one row per customer_unique_id.

    columns:
      - name: customer_unique_id
        description: Unique identifier for the underlying customer.
        data_tests:
          - unique
          - not_null

      - name: total_orders
        description: Total number of orders placed by the customer.
        data_tests:
          - not_null

      - name: is_repeat_customer
        description: Whether the customer placed more than one order.
        data_tests:
          - not_null

      - name: first_order_date
        description: Timestamp of the customer's first observed order.
        data_tests:
          - not_null

      - name: last_order_date
        description: Timestamp of the customer's latest observed order.
        data_tests:
          - not_null
  - name: int_products_enriched
    description: >
      Product-level analytical dataset combining catalogue
      attributes, category translations and aggregated
      sales metrics. The grain is one row per product_id.

    columns:
      - name: product_id
        description: Unique product identifier.
        data_tests:
          - unique
          - not_null

      - name: total_order_items
        description: Number of order-item records for the product.
        data_tests:
          - not_null

      - name: distinct_orders
        description: Number of distinct orders containing the product.
        data_tests:
          - not_null

      - name: distinct_sellers
        description: Number of distinct sellers selling the product.
        data_tests:
          - not_null

  - name: int_sellers_enriched
    description: >
      Seller-level analytical dataset combining seller
      catalogue attributes and aggregated sales metrics.
      The grain is one row per seller_id.

    columns:
      - name: seller_id
        description: Unique seller identifier.
        data_tests:
          - unique
          - not_null

      - name: total_order_items
        description: Total order-item records associated with the seller.
        data_tests:
          - not_null

      - name: distinct_orders
        description: Number of distinct orders handled by the seller.
        data_tests:
          - not_null

      - name: distinct_products
        description: Number of distinct products sold by the seller.
        data_tests:
          - not_null

  - name: int_delivery_performance
    description: >
      Order-level delivery performance dataset containing
      delivery durations, delivery classifications and
      timestamp quality indicators. The grain is one row
      per order_id.

    columns:
      - name: order_id
        description: Unique order identifier.
        data_tests:
          - unique
          - not_null

      - name: order_status
        description: Current recorded order status.
        data_tests:
          - not_null

      - name: delivery_status_category
        description: >
          Classification of the order as early, on_time,
          late, not_delivered, or missing/invalid delivery.

        data_tests:
          - not_null

      - name: has_carrier_before_approval
        data_tests:
          - not_null

      - name: has_delivery_before_carrier
        data_tests:
          - not_null

      - name: has_delivery_timestamp_status_mismatch
        data_tests:
          - not_null

